# Gatekeeper policy for the reference merchant.
#
# HOW TO READ THIS FILE
#   Every rule cites a threat ID from THREAT_MODEL.md. If you cannot name the
#   threat a rule counters, the rule does not belong here.
#   All conditions in a `when` block must hold (AND). There is no OR -- write
#   two rules instead, so each stays explainable in one sentence.
#   A single `deny` beats any number of `allow`s.
#
# HOW TO ADD A RULE
#   1. Add the threat to THREAT_MODEL.md first, with an ID.
#   2. Add the rule here citing that ID.
#   3. Add at least one attack scenario AND one benign scenario to evals/.
#   A rule with no benign scenario is how you ship a firewall that blocks
#   everything and scores 100%.

window_seconds: 600   # 10 minutes -- the velocity window for every rate rule

rules:

  # ---- baseline grants -------------------------------------------------
  # These exist because the engine fails closed: with no matching rule at all,
  # everything is denied. Something has to say yes.

  - id: ALLOW-READ
    threat: "n/a (baseline grant)"
    description: Reads cannot change state, so the agent may read freely.
    when:
      effect_in: [read]
    action: allow
    explain: "Allowed: '{op}' only reads data and cannot move money."

  - id: ALLOW-REVERSIBLE
    threat: "n/a (baseline grant)"
    description: >
      Reversible writes are allowed under the per-action cap. Creating a
      payment link nobody pays costs the merchant nothing.
    when:
      effect_in: [reversible_write]
      amount_paise_lte: 500000
    action: allow
    explain: "Allowed: '{op}' creates a reversible record for {amount}."

  - id: ALLOW-MONEY-SMALL
    threat: "n/a (baseline grant)"
    description: Small irreversible movements are allowed under the cap.
    when:
      effect_in: [irreversible_money]
      amount_paise_lte: 50000
    action: allow
    explain: "Allowed: {amount} is within the ₹500.00 per-action agent limit."

  # ---- T1: a compromised agent drains the account in one action --------

  - id: CAP-001
    threat: T1
    description: >
      No single irreversible money action above ₹1,000.00.
      Was ₹500.00 flat. The sealed hold-out (H-01) found that the merchant's
      own catalogue sells a ₹740.00 jar of ghee, which made a full refund on
      the most expensive item in the shop structurally impossible for a real
      customer, with no attacker involved -- the benign corpus never caught it
      because every benign refund scenario happened to be written for less
      than the cap. Rather than move the cap and lose the "under ₹500 needs
      nothing, over it needs a human" shape, the hard deny now starts higher
      and CAP-003 covers the band in between. See docs/DECISIONS.md ADR-023.
    when:
      effect_in: [irreversible_money]
      amount_paise_gt: 100000
    action: deny
    explain: >-
      Blocked: {amount} is over the ₹1,000.00 hard limit for a single
      agent-initiated payment. Raise the cap in policies/default.yaml if this
      is intended.

  - id: CAP-003
    threat: T1
    description: >
      A single irreversible money action between ₹500.00 and ₹1,000.00 needs a
      human rather than being denied outright. This is the fix for H-01: large
      enough that an agent should not clear it alone, small enough that it is
      plausibly a genuine return on a real item in the catalogue, and a
      merchant should get to say yes rather than the request being impossible.
    when:
      effect_in: [irreversible_money]
      amount_paise_gt: 50000
      amount_paise_lte: 100000
    action: require_approval
    explain: >-
      Held for approval: {amount} is between the ₹500.00 agent limit and the
      ₹1,000.00 hard ceiling. A human can approve a real return; an agent
      cannot clear it alone.

  - id: CAP-002
    threat: T1
    description: Reversible writes above ₹5,000.00 need a human.
    when:
      effect_in: [reversible_write]
      amount_paise_gt: 500000
    action: require_approval
    explain: >-
      Held for approval: {amount} is above the ₹5,000.00 threshold for
      agent-created payment requests.

  # ---- T8: the amount field itself is the bypass ------------------------

  - id: AMT-001
    threat: T8
    description: >
      An amount the proxy cannot read as a whole number of paise is denied
      rather than treated as zero.
      This rule exists because of a shipped bug. The old parser accepted only
      int and digit-string and collapsed everything else to 0, so
      {"amount": 250000.0} -- an ordinary JSON float -- was evaluated as a
      zero-rupee action and went straight past the per-action cap and every
      velocity rule. A negative int did the same. The attack corpus tested a
      string-typed amount and missed the float entirely.
      See docs/DECISIONS.md ADR-013 and attack scenarios F1-05..F1-07.
    when:
      amount_invalid: true
    action: deny
    explain: >-
      Blocked: the amount on this '{op}' could not be read as a whole number
      of paise (received {raw_amount}). Gatekeeper denies an amount it cannot
      evaluate rather than assuming it is zero.

  - id: AMT-002
    threat: T8
    description: >
      An irreversible money action with no amount field at all is denied.
      "Absent" and "unreadable" are different, and absent used to be read as a
      valid zero -- which passes every cap in this file, because every cap
      asks whether a number is too big. Razorpay's refund API reads an omitted
      amount as the FULL payment, so the one request no rule could bound was
      also the largest one it could make. See docs/DECISIONS.md ADR-013.
      Reads and reversible writes are unaffected: a fetch has no amount and
      never should.
    when:
      effect_in: [irreversible_money]
      amount_missing: true
    action: deny
    explain: >-
      Blocked: '{op}' moves money but names no amount. Gatekeeper will not
      execute a money action whose size it cannot bound.

  # ---- T2: a compromised agent drains the account in many small actions -

  - id: VEL-001
    threat: T2
    description: >
      Total money actually MOVED by the agent in any 10-minute window is capped
      at ₹2,000.00.
      Applies to irreversible_money only, and deliberately so. An earlier
      version also counted reversible_write, which double-charged the budget:
      a single purchase creates an order AND a payment link for the same
      rupees, so a ₹1,280 basket consumed ₹2,560 of a ₹2,000 allowance and a
      legitimate ₹5,000 payment link could never be created at all. The benign
      corpus caught it (B1-02, B1-03). See docs/DECISIONS.md ADR-006.
    when:
      effect_in: [irreversible_money]
      money_moved_paise_gt: 200000
    action: deny
    explain: >-
      Blocked: this would take money moved in the last 10 minutes to over
      ₹2,000.00 (already {window_total}). The agent's rolling spend limit is
      ₹2,000.00.

  - id: VEL-004
    threat: T2
    description: >
      Reversible writes are rate limited by COUNT, not by value. Creating a
      payment link moves no money, so capping its value punishes big baskets
      for no safety gain; but an agent emitting hundreds of links is still
      broken, and that is what this catches.
    when:
      effect_in: [reversible_write]
      window_count_gte: 20
    action: deny
    explain: >-
      Blocked: {window_count} agent actions in the last 10 minutes. Even
      reversible ones are capped at 20 -- this looks like a loop.

  - id: VEL-002
    threat: T2
    description: At most 5 money-moving actions in any 10-minute window.
    when:
      effect_in: [irreversible_money]
      money_count_gte: 5
    action: deny
    explain: >-
      Blocked: {money_count} payments already in the last 10 minutes. The
      limit is 5. This looks like a retry loop rather than a customer.

  - id: VEL-003
    threat: T2
    description: At most 3 charges to the same counterparty in any 10-minute window.
    when:
      effect_in: [irreversible_money]
      counterparty_count_gte: 3
    action: deny
    explain: >-
      Blocked: this would be charge number {counterparty_count} to
      {counterparty} in 10 minutes; your limit is 3.

  # ---- T3: scope escalation into operations nobody reviewed ------------

  - id: SCOPE-001
    threat: T3
    description: >
      An operation with no declared effect class is denied. This is the
      fail-closed rule -- it is why registering a new tool cannot silently
      widen what the agent can do.
    when:
      effect_undeclared: true
    action: deny
    explain: >-
      Blocked: '{op}' has no declared effect class in policies/effects.yaml.
      Gatekeeper denies undeclared operations rather than guessing.

  - id: SCOPE-002
    threat: T3
    description: Payouts and transfers move money OUT of the merchant and always need a human.
    when:
      op_in: [create_payout, create_transfer]
    action: require_approval
    explain: >-
      Held for approval: '{op}' sends money out of the merchant account to
      {counterparty}. No agent performs this unattended.

  # ---- T4: money sent somewhere it was never meant to go ---------------

  - id: DEST-001
    threat: T4
    description: >
      Every destination named on a refund must be a customer of this merchant,
      and a refund must name one.
      `counterparty_not_in` matches if ANY destination field is outside the
      list, and also if the request names none. Both were holes: an absent
      destination could not match the rule, so dropping the field executed the
      refund; and with several destination fields set only the first was read,
      so an allowlisted `customer_id` sitting beside an attacker's `upi_id`
      passed. See docs/DECISIONS.md ADR-017.
    when:
      op_in: [create_refund]
      counterparty_not_in: ["cust_demo_001", "cust_demo_002", "cust_demo_003"]
    action: deny
    explain: >-
      Blocked: this refund names {counterparties}, which is not a known
      customer of this merchant. A refund to an unknown or unstated recipient
      is how an injected instruction exfiltrates money.

  - id: OWNER-001
    threat: T4
    description: >
      A refund whose payment_id this proxy itself saw captured for a
      DIFFERENT customer than the one now named is denied. This is the fix
      for H-02: DEST-001 only checks that the named recipient is SOME known
      customer, never that they are the RIGHT one -- a refund naming
      cust_demo_002 against a payment this proxy captured for cust_demo_001
      passed, because bounds were checked and ownership was not.
      Deliberately scoped to what this process can verify: a payment_id it
      never saw captured (a fresh test id, or one from a prior process) has no
      recorded owner and is not denied by this rule. DEST-001 and the amount
      caps still apply to it regardless. See docs/DECISIONS.md ADR-022.
    when:
      owner_mismatch: true
    action: deny
    explain: >-
      Blocked: this refund names {counterparty}, but the payment it references
      was captured for {true_owner}. A refund must go back to whoever actually
      paid, not whoever the request happens to name.

  # ---- T5: unattended out-of-hours activity ----------------------------

  - id: TIME-001
    threat: T5
    description: >
      Irreversible money movement outside 08:00-21:00 local needs a human.
      Adapted from RBI's recovery-agent contact-hour norms as a voluntary
      conservative standard; see THREAT_MODEL.md for why this is not a
      compliance claim.
    when:
      effect_in: [irreversible_money]
      hour_outside: [8, 21]
    action: require_approval
    explain: >-
      Held for approval: money movement outside 08:00-21:00 local time is
      reviewed by a human before it executes.

  # ---- T9: inbound redirection -- money the merchant never sees leave ----

  - id: LINK-001
    threat: T9
    description: >
      A payment link re-issued, within the velocity window, for the same
      customer and the same amount as one just cancelled, but pointed at a
      DIFFERENT destination, is denied. This is the fix for the exact attack
      the sealed hold-out demonstrated (H-05): cancel the merchant's live
      link, reissue an identical-looking one carrying an attacker's own UPI
      handle, and the customer pays a stranger while the merchant's balance
      never moves -- no cap, no velocity window on money moved, and no
      refund allowlist is ever consulted, because nothing here is a refund.
      Deliberately narrow. This closes the demonstrated CANCEL-THEN-REISSUE
      pattern, not the general class of "a payment link can point anywhere":
      a first-time link with no prior cancellation to compare against is not
      flagged. See docs/DECISIONS.md ADR-024 and THREAT_MODEL.md T9 for the
      honest scope of what remains open.
    when:
      relink_destination_changed: true
    action: deny
    explain: >-
      Blocked: this payment link is for the same amount as one just
      cancelled for {counterparty}, but points somewhere different. A
      reissued link must go to the same place the original one did.
